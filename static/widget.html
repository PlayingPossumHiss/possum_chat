<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Виджет</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="icon" href="/img/favicon.ico">
    <link rel='stylesheet' type='text/css' media='screen' href='/css/widget.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='/css/custom_style.css'>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script src='/js/widget.js'></script>
</head>
<body>
    <div id="app">
        <div class="vote" v-bind:class="{'hidden': vote.length == 0}">
            <div class="candidate" v-for="candidate in vote">
                {{candidate.text}}: {{candidate.count}}
            </div>
        </div>
    </div>
</body>
</html>
